version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: taskflow_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - taskflow_network

  backend:
    build: ./backend
    container_name: taskflow_backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/taskflow
      - JWT_ACCESS_SECRET=your_jwt_access_secret_key
      - JWT_REFRESH_SECRET=your_jwt_refresh_secret_key
      - ACCESS_TOKEN_EXPIRES=15m
      - REFRESH_TOKEN_EXPIRES=7d
      - WORKER_COUNT=4
      - MAX_RETRIES=3
      - JOB_TIMEOUT=60000
      - CORS_ORIGIN=http://localhost:80
      - NODE_ENV=production
    depends_on:
      - mongodb
    networks:
      - taskflow_network

  frontend:
    build: ./frontend
    container_name: taskflow_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - taskflow_network

volumes:
  mongo_data:

networks:
  taskflow_network:
    driver: bridge
